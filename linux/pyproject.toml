[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veroscudo"
dynamic = ["version"]
description = "VeroScudo - Master the switch. Strict VPN kill-switch and auto-reconnect for NetworkManager VPNs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Dmitry Koshelenko (GomelHawk)" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3"]     # ruff pinned: its default rules change between releases (Dependabot bumps it)

[project.scripts]
veroscudo = "veroscudo.cli:main"

[tool.setuptools.dynamic]
version = { attr = "veroscudo.__version__" }    # one source of truth

[tool.setuptools.packages.find]
include = ["veroscudo*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
ignore = ["E702"]     # one-line GTK widget setup in tray.py (and compact test asserts) is the house style

[tool.pytest.ini_options]
testpaths = ["tests"]
